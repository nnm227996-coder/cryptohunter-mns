name: CryptoHunter v2

on:
  schedule:
    # Two offset schedules to avoid the top-of-hour spike on GitHub Actions.
    # The concurrency group below ensures we never run twice in parallel.
    - cron: "2-59/5 * * * *"    # primary: every 5 min, offset +2  (00:02, 00:07, 00:12 ...)
    - cron: "7-59/10 * * * *"   # backup:  every 10 min, offset +7 (00:07, 00:17, 00:27 ...)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scan_once.py'
      - 'config.py'
      - 'engines/**'
      - '.github/workflows/cryptohunter.yml'

permissions:
  contents: write

concurrency:
  group: cryptohunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cooldown state
        uses: actions/cache/restore@v4
        with:
          path: cooldown_state.json
          key: cooldown-state-${{ github.run_id }}
          restore-keys: |
            cooldown-state-

      - name: Run scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '70' }}
        run: |
          echo "=== before scan ==="
          pwd
          ls docs/ || true
          head -5 docs/state.json || true
          echo ""
          echo "=== running scan_once.py ==="
          python -u scan_once.py 2>&1
          echo ""
          echo "=== after scan ==="
          head -5 docs/state.json || true
          echo ""
          echo "=== git status ==="
          git status

      - name: Save cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cooldown_state.json
          key: cooldown-state-${{ github.run_id }}

      - name: Commit dashboard + trades
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f docs/state.json ] && git add docs/state.json
          [ -f docs/trades.json ] && git add docs/trades.json
          if git diff --cached --quiet; then
            echo "No state/trades changes to commit."
            exit 0
          fi
          git commit -m "chore(dashboard): update state + trades [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "All push attempts failed."
          exit 1
